# 共通質問：全テーマの冒頭に表示。一度答えれば他テーマでも引き継ぐ（shared: true）
# 選択肢は仕様書3章の「既存の12業種／4区分／4段階／予算6区分」に合わせ、DX事例360（旧DIAG_FLOW・BUDGET_LABELS）と
# 同じカテゴリをそのまま再利用する。事例一覧の業種・予算フィルタと表現をそろえるため。
nodes:
  - id: q_industry
    type: ask_single
    shared: true
    text: お客さまの業種は何ですか？
    why: 業種によって向いているツールや事例が変わります
    options: [小売・EC, 飲食・食品, 医療・介護, 建設・不動産, 教育・研修, 金融・保険, 製造業, 物流・運輸, 農業・一次産業, 人事・バックオフィス, 観光・ホテル, NPO・行政・地域]
  - id: q_size
    type: ask_single
    shared: true
    text: 会社の規模を教えてください
    why: 人数で「誰が運用するか」の現実的な提案が変わります
    options: [1〜10名（個人・小規模）, 11〜50名（中小企業）, 51〜300名（中堅企業）, 300名以上（大企業）]
  - id: q_digital
    type: ask_single
    shared: true
    text: 今のデジタル化の状況に近いのはどれですか？
    why: 出発点に合わせて説明の粒度を変えます
    options: [紙や電話がまだ多く、デジタルはほとんど使っていない, メールやExcelは使っているが、もっと効率化したい, クラウドやアプリを使い始めているが、まだ改善余地がある, かなりデジタル化が進んでいて、新しいビジネスに挑戦したい]
  - id: q_budget
    type: ask_single
    shared: true
    text: 月にかけられる予算の感覚はどれくらいですか？
    why: 予算に合う選択肢だけをご案内するためです
    options: [無料, 〜月1,000円, 〜月5,000円, 〜月3万円, 〜月10万円, 月10万円超]
