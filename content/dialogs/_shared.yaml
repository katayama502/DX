# 共通質問：全テーマの冒頭に表示。一度答えれば他テーマでも引き継ぐ（shared: true）
nodes:
  - id: q_industry
    type: ask_single
    shared: true
    text: お客さまの業種は何ですか？
    why: 業種によって向いているツールや事例が変わります
    options: [飲食, 小売, サービス業, 宿泊・観光, 製造, 建設, 農業, その他]
  - id: q_size
    type: ask_single
    shared: true
    text: 従業員は何人くらいですか？（ご本人を含む）
    why: 人数で「誰が運用するか」の現実的な提案が変わります
    options: [1人, 2〜5人, 6〜20人, 21人以上]
  - id: q_digital
    type: ask_single
    shared: true
    text: 今のデジタル化の状況に近いのはどれですか？
    why: 出発点に合わせて説明の粒度を変えます
    options: [ほぼ紙と電話, スマホやLINEは使う, パソコンで表計算や会計をしている, クラウドサービスを複数使っている]
  - id: q_budget
    type: ask_single
    shared: true
    text: 月にかけられる予算の感覚はどれくらいですか？
    why: 予算に合う選択肢だけをご案内するためです
    options: [無料で始めたい, 〜月1,000円, 〜月5,000円, 〜月3万円, それ以上, まだわからない]
