theme: website-new
nodes:
  - id: s0
    type: say
    text: ホームページのご相談ですね。いくつか質問しますので、お客さまに聞きながら選んでください。途中でやめても大丈夫です。
  - id: q_goal
    type: ask_single
    text: ホームページで一番したいことは何ですか？
    why: 目的で「作り方」と「費用」が大きく変わります
    options: [場所や営業時間を知ってほしい, 予約や問い合わせを受けたい, 商品をネットで売りたい, 会社の信用・採用のため, まだ決まっていない]
  - id: q_gbp
    type: ask_single
    text: Googleでお店の名前を検索すると、地図と一緒に出てきますか？
    why: 無料のGoogleビジネスプロフィールが未登録なら、そこから始めるのが最短です
    options: [出てくる, 出てこない, わからない]
  - id: q_who
    type: ask_single
    text: 作ったあと、写真や文章を更新するのは誰ですか？
    why: 更新する人がいないと、作っても情報が古くなります
    options: [自分でやる, 家族・スタッフがやる, 業者に任せたい, 決まっていない]
  - id: q_ec
    type: ask_single
    show_if: { q_goal: [商品をネットで売りたい] }
    text: ネットで売る商品は何点くらいですか？
    why: 点数と決済・配送の仕組みで、向いているサービスが変わります
    options: [数点, 10〜50点, 50点以上, わからない]
  - id: q_existing
    type: ask_single
    text: 今、ホームページはありますか？
    why: 既存サイトがある場合、作り直しか修正かで判断が変わります
    options: [ない, ある（古い・更新していない）, ある（使っている）]
  - id: end
    type: say
    text: ありがとうございます。ここまでの内容をまとめました。
