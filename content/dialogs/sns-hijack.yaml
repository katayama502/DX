theme: sns-hijack
nodes:
  - id: s0
    type: say
    text: 落ち着いて対応しましょう。まず状況を確認します。これ以上リンクを開いたり、番号を入力したりしないでください。
  - id: q_status
    type: ask_multi
    text: 今の状況に近いものを選んでください（複数可）
    why: 被害が進行中かどうかで、最初にやることが変わります
    options: [SNSに勝手に投稿されている, ログインできなくなった, 不審なメールのリンクを開いた, お金を振り込んだ・カード番号を入れた, 取引先から「変なメッセージが来た」と言われた, まだ何も起きていないが不安]
  - id: q_money
    type: ask_single
    show_if: { q_status: [お金を振り込んだ・カード番号を入れた] }
    text: 銀行・カード会社にはもう連絡しましたか？
    why: 金銭被害は時間が経つほど取り戻しにくくなります
    options: [連絡した, まだ]
  - id: q_password
    type: ask_single
    text: 同じパスワードを他のサービスでも使っていますか？
    why: 使い回しがあると、被害が他のサービスに広がります
    options: [使っている, 使っていない, わからない]
  - id: q_police
    type: ask_single
    text: 警察やIPAの相談窓口には連絡しましたか？
    why: 相談記録が後の手続きに役立ちます
    options: [連絡した, まだ]
  - id: end
    type: say
    text: ここまでの内容をまとめました。この後は初動チェックリストを上から順に進めてください。
