# 用語集（相談テーマ用）。既存 DX事例360 の用語は terms.legacy.json から合流する
- term: ドメイン
  reading: どめいん
  description: ホームページの「住所」にあたる文字列（例：example.jp）。年1,000〜3,000円程度で取得し、毎年更新が必要。
- term: SSL
  reading: えすえすえる
  description: ホームページの通信を暗号化する仕組み。対応していると「https://」で始まり、鍵マークが付く。多くの作成サービスで無料で付く。
- term: Googleビジネスプロフィール
  reading: ぐーぐるびじねすぷろふぃーる
  description: Google検索やGoogleマップに、お店の場所・営業時間・写真・口コミを無料で表示できるサービス。
- term: 決済手数料
  reading: けっさいてすうりょう
  description: キャッシュレスで支払われた金額のうち、決済会社に支払う割合。売上の1〜3%程度が一般的で、契約ごとに異なる。
- term: 入金サイクル
  reading: にゅうきんさいくる
  description: キャッシュレスの売上が自分の口座に振り込まれるまでの周期。翌日・週1回・月2回など、会社によって違う。
- term: QRコード決済
  reading: きゅーあーるこーどけっさい
  description: PayPayなどのアプリでQRコードを読み取って支払う方法。店側は紙のQRコードを置くだけで始められるものもある。
- term: インボイス
  reading: いんぼいす
  description: 消費税の仕入税額控除に必要な「適格請求書」のこと。登録番号など決められた項目が書かれた請求書・領収書。
- term: 電子帳簿保存法
  reading: でんしちょうぼほぞんほう
  description: 帳簿や請求書・領収書を電子データで保存するときのルールを定めた法律。メールやWebで受け取った書類は電子のまま保存する必要がある。
- term: 課税事業者
  reading: かぜいじぎょうしゃ
  description: 消費税を納める義務のある事業者。前々年の課税売上が1,000万円を超えると該当する。インボイス登録をすると課税事業者になる。
- term: 生成AI
  reading: せいせいえーあい
  description: 文章・画像・音声などを作り出すAI。ChatGPT、Gemini、Claudeなどが代表的。質問文（プロンプト）を入力すると答えを返す。
- term: プロンプト
  reading: ぷろんぷと
  description: 生成AIへの指示文のこと。「〇〇について300字で書いて」のように、具体的に書くほど良い答えが返りやすい。
- term: 学習データ
  reading: がくしゅうでーた
  description: AIが賢くなるために使う情報。入力した内容が学習データに使われる設定になっていると、他の人への回答に影響する可能性がある。
- term: 二段階認証
  reading: にだんかいにんしょう
  description: パスワードに加えて、スマホに届く番号などでもう一度本人確認する仕組み。乗っ取り対策として最も効果が高い。
- term: フィッシング
  reading: ふぃっしんぐ
  description: 銀行や宅配業者などになりすましたメール・SMSで偽サイトに誘導し、パスワードやカード番号を盗む手口。
- term: 乗っ取り
  reading: のっとり
  description: 他人にアカウントへ不正にログインされ、勝手に投稿や購入をされること。パスワードの使い回しが主な原因。
- term: オーナー確認
  reading: おーなーかくにん
  description: Googleビジネスプロフィールの情報を編集する権限を持つために行う本人確認。郵送はがき・電話・メールなどの方法がある。
- term: クラウドPOSレジ
  reading: くらうどぽすれじ
  description: インターネット経由でデータを管理するレジ。タブレットやスマホでも使え、売上データが自動で集計・保存される。
- term: キャンセルポリシー
  reading: きゃんせるぽりしー
  description: 予約のキャンセルや無断不参加（ノーショー）が起きたときのルール。キャンセル料の有無や期限を事前に決めておくもの。
- term: バックアップ
  reading: ばっくあっぷ
  description: 大事なデータのコピーを別の場所（クラウドや外部ディスク）に保存しておくこと。故障や誤操作でデータが消えても復元できる。
- term: Instagramビジネスアカウント
  reading: いんすたぐらむびじねすあかうんと
  description: 個人アカウントを無料で切り替えられるビジネス向けの機能。閲覧数などの分析データが見られ、広告出稿もしやすくなる。
- term: LINE公式アカウント
  reading: らいんこうしきあかうんと
  description: お店や会社がLINEで顧客に一斉配信できる法人向け機能。友だち登録した人にクーポンやお知らせを届けられる。
- term: IT導入補助金
  reading: あいてぃーどうにゅうほじょきん
  description: 中小企業・小規模事業者がITツールを導入する費用の一部を国が補助する制度。IT導入支援事業者を通じて申請する。
- term: IT導入支援事業者
  reading: あいてぃーどうにゅうしえんじぎょうしゃ
  description: IT導入補助金の申請手続きをサポートする、事前に登録されたITベンダー・販売店のこと。
- term: DX認定
  reading: でぃーえっくすにんてい
  description: 経済産業省が、DXに取り組む準備が整っている事業者を認定する制度（正式名称：DX認定制度）。取得しても補助金が出るわけではないが、一部の補助金で加点されることがある。
